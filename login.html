<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 加园地产团队 · HOME DIRECT</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface-warm:#f7f7f7;
  --fg:#222222;--muted:#6a6a6a;--meta:#929292;
  --border:#dddddd;--border-soft:#ebebeb;
  --accent:#ff385c;--accent-hover:#e31c5f;--accent-soft:#fff0f3;
  --dark:#1a1a1a;
  --font:-apple-system,system-ui,"Helvetica Neue",Roboto,sans-serif;
  --radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:9999px;
  --shadow-card:rgba(0,0,0,0.02) 0 0 0 1px,rgba(0,0,0,0.05) 0 2px 8px 0,rgba(0,0,0,0.08) 0 12px 28px 0;
  --motion:180ms cubic-bezier(0.2,0,0,1);
}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);color:var(--fg);background:var(--bg);line-height:1.43}
a{color:inherit;text-decoration:none}

.shell{display:flex;min-height:100vh}

/* ── Brand panel ── */
.brand-panel{flex:1.05;position:relative;overflow:hidden;background:var(--dark);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:40px 44px}
.brand-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand-veil{position:absolute;inset:0;background:linear-gradient(158deg,rgba(20,20,20,0.88) 0%,rgba(20,20,20,0.52) 46%,rgba(255,56,92,0.30) 100%)}
.brand-top{position:relative;z-index:2}
.brand-logo{width:52px;height:52px;border-radius:var(--radius-md);background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff}
.brand-name{margin-top:18px;font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.brand-sub{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:0.22em;color:rgba(255,255,255,0.72)}
.brand-tagline{position:relative;z-index:2;max-width:380px;font-size:15px;line-height:1.6;color:rgba(255,255,255,0.86)}
.brand-foot{position:relative;z-index:2;font-size:12px;color:rgba(255,255,255,0.55)}

/* ── Login panel ── */
.login-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 32px;background:var(--surface-warm)}
.login-card{width:100%;max-width:432px;animation:rise .5s cubic-bezier(0.2,0,0,1) backwards}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* ── Language switch ── */
.lang-switch{position:relative;display:flex;justify-content:flex-end}
.lang-trigger{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--bg);font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all var(--motion)}
.lang-trigger:hover{border-color:var(--accent);color:var(--accent)}
.lang-trigger:focus-visible{outline:none;box-shadow:0 0 0 2px var(--fg)}
.lang-trigger svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lang-trigger .chev{width:10px;height:10px;transition:transform var(--motion)}
.lang-switch.open .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:126px;padding:6px;background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity var(--motion),transform var(--motion),visibility var(--motion);z-index:10}
.lang-switch.open .lang-menu{opacity:1;visibility:visible;transform:none}
.lang-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:7px 10px;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:600;color:var(--fg);cursor:pointer;border-radius:6px;transition:background var(--motion);text-align:left}
.lang-option:hover{background:var(--surface-warm)}
.lang-option.active{color:var(--accent)}
.lang-option .check{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2;opacity:0}
.lang-option.active .check{opacity:1}

.login-eyebrow{margin-top:18px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:0.02em}
.login-title{margin-top:16px;font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.login-sub{margin-top:8px;font-size:15px;color:var(--muted)}

.roles{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.role-card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);transition:border-color var(--motion),box-shadow var(--motion),transform var(--motion)}
.role-card:hover{border-color:var(--accent);box-shadow:var(--shadow-card);transform:translateY(-2px)}
.role-card:active{transform:scale(0.99)}
.role-card:focus-visible{outline:none;box-shadow:0 0 0 2px var(--fg)}
.role-icon{width:46px;height:46px;flex-shrink:0;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.role-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.role-body{flex:1;min-width:0}
.role-name{display:block;font-size:17px;font-weight:700;letter-spacing:-0.01em}
.role-desc{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.role-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.role-tag{padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface-warm);border:1px solid var(--border-soft);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.role-arrow{width:28px;height:28px;border-radius:50%;background:var(--surface-warm);color:var(--fg);display:flex;align-items:center;justify-content:center;transition:all var(--motion)}
.role-arrow svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.role-card:hover .role-arrow{background:var(--accent);color:#fff}

.login-note{margin-top:26px;font-size:12px;color:var(--meta);display:flex;align-items:center;gap:6px}
.login-note svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Responsive ── */
@media (max-width:880px){
  .shell{flex-direction:column}
  .brand-panel{min-height:220px;padding:28px 24px;justify-content:flex-start;gap:14px}
  .brand-tagline{display:none}
  .brand-foot{display:none}
  .brand-logo{width:44px;height:44px;font-size:20px}
  .brand-name{margin-top:12px;font-size:24px}
  .login-panel{padding:28px 20px 40px;align-items:flex-start}
}
@media (max-width:420px){
  .role-side .role-tag{display:none}
}
</style>
</head>
<body>

<div class="shell">
  <!-- Brand -->
  <aside class="brand-panel">
    <img class="brand-photo" src="images/listings/villa1.jpg" alt="">
    <div class="brand-veil"></div>
    <div class="brand-top">
      <div class="brand-logo">加</div>
      <h1 class="brand-name" data-i18n="brand_name">加园地产团队</h1>
      <div class="brand-sub">HOME DIRECT</div>
    </div>
    <p class="brand-tagline" data-i18n="brand_tagline">房源、内容与团队协作，一站式地产工作台。选择身份，进入属于你的界面。</p>
    <div class="brand-foot" data-i18n="brand_foot">© 2026 HOME DIRECT · 加园地产</div>
  </aside>

  <!-- Login -->
  <main class="login-panel">
    <div class="login-card">
      <div class="lang-switch" id="lang-switch">
        <button type="button" class="lang-trigger" id="lang-trigger" onclick="toggleLangMenu()" aria-haspopup="true" aria-expanded="false" aria-label="Language / 语言">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>
          <span id="lang-current">EN</span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang-menu" id="lang-menu" role="group" aria-label="Language / 语言">
          <button type="button" class="lang-option" data-lang="zh" onclick="applyLang('zh')"><span>简体中文</span><svg class="check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button type="button" class="lang-option" data-lang="en" onclick="applyLang('en')"><span>English</span><svg class="check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button type="button" class="lang-option" data-lang="fr" onclick="applyLang('fr')"><span>Français</span><svg class="check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button type="button" class="lang-option" data-lang="es" onclick="applyLang('es')"><span>Español</span><svg class="check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
        </div>
      </div>

      <span class="login-eyebrow" data-i18n="eyebrow">欢迎回来</span>
      <h2 class="login-title" data-i18n="title">选择你的身份</h2>
      <p class="login-sub" data-i18n="sub">请选择角色以进入对应工作台</p>

      <div class="roles">
        <a class="role-card" href="index.html" data-role="owner">
          <span class="role-icon">
            <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-7h6v7"/></svg>
          </span>
          <span class="role-body">
            <span class="role-name">Owner</span>
            <span class="role-desc" data-i18n="owner_desc">业主 · 团队管理后台</span>
          </span>
          <span class="role-side">
            <span class="role-tag" data-i18n="tag_desktop">桌面端</span>
            <span class="role-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
          </span>
        </a>

        <a class="role-card" href="mobile-feed.html" data-role="agent">
          <span class="role-icon">
            <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/></svg>
          </span>
          <span class="role-body">
            <span class="role-name">Agent</span>
            <span class="role-desc" data-i18n="agent_desc">经纪人 · 移动内容流</span>
          </span>
          <span class="role-side">
            <span class="role-tag" data-i18n="tag_mobile">移动端</span>
            <span class="role-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
          </span>
        </a>
      </div>

      <p class="login-note">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span data-i18n="note">演示环境 · 暂不需要密码</span>
      </p>
    </div>
  </main>
</div>

<script>
  document.querySelectorAll('.role-card').forEach(function (card) {
    card.addEventListener('click', function () {
      try { sessionStorage.setItem('pp-role', card.dataset.role); } catch (e) {}
    });
  });

  // ── Language: persisted and shared across the whole experience ──
  var LANG_KEY = 'pp-lang';
  var LANG_IDS = ['zh', 'en', 'fr', 'es'];
  var LANG_LABELS = { zh: '简体', en: 'EN', fr: 'FR', es: 'ES' };
  var I18N = {
    zh: {
      brand_name: '加园地产团队',
      brand_tagline: '房源、内容与团队协作，一站式地产工作台。选择身份，进入属于你的界面。',
      brand_foot: '© 2026 HOME DIRECT · 加园地产',
      eyebrow: '欢迎回来',
      title: '选择你的身份',
      sub: '请选择角色以进入对应工作台',
      owner_desc: '业主 · 团队管理后台',
      tag_desktop: '桌面端',
      agent_desc: '经纪人 · 移动内容流',
      tag_mobile: '移动端',
      note: '演示环境 · 暂不需要密码',
      page_title: '登录 — 加园地产团队 · HOME DIRECT'
    },
    en: {
      brand_name: 'HOME DIRECT Team',
      brand_tagline: 'Listings, content and team collaboration in one real-estate workspace. Pick your role to enter your interface.',
      brand_foot: '© 2026 HOME DIRECT Real Estate',
      eyebrow: 'Welcome back',
      title: 'Choose your role',
      sub: 'Select a role to enter the matching workspace',
      owner_desc: 'Owner · Team admin dashboard',
      tag_desktop: 'Desktop',
      agent_desc: 'Agent · Mobile content feed',
      tag_mobile: 'Mobile',
      note: 'Demo environment · No password required',
      page_title: 'Login — HOME DIRECT Team'
    },
    fr: {
      brand_name: 'Équipe HOME DIRECT',
      brand_tagline: 'Annonces, contenu et collaboration d\'équipe dans un espace de travail immobilier. Choisissez votre rôle pour entrer.',
      brand_foot: '© 2026 HOME DIRECT Immobilier',
      eyebrow: 'Bon retour',
      title: 'Choisissez votre rôle',
      sub: 'Sélectionnez un rôle pour accéder à l\'espace correspondant',
      owner_desc: 'Propriétaire · Tableau de bord d\'équipe',
      tag_desktop: 'Ordinateur',
      agent_desc: 'Agent · Fil de contenu mobile',
      tag_mobile: 'Mobile',
      note: 'Environnement de démo · Aucun mot de passe requis',
      page_title: 'Connexion — Équipe HOME DIRECT'
    },
    es: {
      brand_name: 'Equipo HOME DIRECT',
      brand_tagline: 'Listings, contenido y colaboración del equipo en un espacio de trabajo inmobiliario. Elige tu rol para entrar.',
      brand_foot: '© 2026 HOME DIRECT Inmobiliaria',
      eyebrow: 'Bienvenido de nuevo',
      title: 'Elige tu rol',
      sub: 'Selecciona un rol para entrar al espacio correspondiente',
      owner_desc: 'Propietario · Panel de administración del equipo',
      tag_desktop: 'Escritorio',
      agent_desc: 'Agente · Feed de contenido móvil',
      tag_mobile: 'Móvil',
      note: 'Entorno de demostración · No se requiere contraseña',
      page_title: 'Acceso — Equipo HOME DIRECT'
    }
  };

  function applyLang(lang) {
    if (LANG_IDS.indexOf(lang) < 0) lang = 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang;
    var dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.title = dict.page_title;
    document.getElementById('lang-current').textContent = LANG_LABELS[lang];
    document.querySelectorAll('.lang-option').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    closeLangMenu();
  }

  function toggleLangMenu() {
    var wrap = document.getElementById('lang-switch');
    var open = wrap.classList.toggle('open');
    document.getElementById('lang-trigger').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function closeLangMenu() {
    document.getElementById('lang-switch').classList.remove('open');
    document.getElementById('lang-trigger').setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', function (e) {
    if (!document.getElementById('lang-switch').contains(e.target)) closeLangMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLangMenu();
  });

  (function () {
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    applyLang(saved && LANG_IDS.indexOf(saved) >= 0 ? saved : 'en');
  })();
</script>

</body>
</html>
