<div class="modal-overlay" id="modal-template-preview">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <h3 id="tpl-preview-title" data-i18n="tpl_preview">模板预览</h3>
      <button class="btn btn-ghost" data-action="modal:close" data-modal="modal-template-preview">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label style="font-size:var(--text-sm);font-weight:600;display:block;margin-bottom:6px" data-i18n="tpl_select_listing">选择房源</label>
        <select id="tpl-listing-select" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-size:var(--text-sm);color:var(--fg);cursor:pointer" data-change="template:refresh-preview"></select>
      </div>
      <div id="tpl-preview-design" style="border-radius:var(--radius-md);overflow:hidden;margin-bottom:var(--space-4)"></div>
      <div id="tpl-preview-meta"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="modal:close" data-modal="modal-template-preview" data-i18n="btn_cancel">取消</button>
      <button class="btn btn-primary" data-action="template:use" data-i18n="btn_use_template">使用此模板</button>
    </div>
  </div>
</div>
