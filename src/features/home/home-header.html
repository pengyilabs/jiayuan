    <header class="dash-header" data-od-id="dash-header">
      <div class="dash-header-top">
        <div class="dash-team">
          <button class="mobile-menu-btn" data-action="sidebar:toggle" aria-label="Menu" data-i18n-aria-label="aria_menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="dash-team-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span class="dash-team-name" data-i18n="brand">加园地产团队</span>
          <span class="dash-team-handle">@jiayuanrealestate</span>
        </div>
        <div class="dash-stats">
          <div class="dash-stat"><span class="dash-stat-value" id="stat-total">0</span><span class="dash-stat-label" data-i18n="stat_total_posts">Posts</span></div>
          <div class="dash-stat"><span class="dash-stat-value" id="stat-pending">0</span><span class="dash-stat-label" data-i18n="stat_pending">Pending</span></div>
          <div class="dash-stat"><span class="dash-stat-value" id="stat-approved">0</span><span class="dash-stat-label" data-i18n="stat_approved">Approved</span></div>
          <div class="dash-stat"><span class="dash-stat-value" id="stat-published">0</span><span class="dash-stat-label" data-i18n="stat_published">Published</span></div>
        </div>
        <div class="dash-actions">
          <div class="topbar-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search listings, posts...">
          </div>
          <div class="lang-switch" data-od-id="lang-switch">
            <button class="lang-trigger" id="lang-trigger" data-action="lang:toggle">
              <span id="lang-current">EN</span>
              <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="lang-dropdown" id="lang-dropdown">
              <button class="lang-option" data-lang="zh" data-action="lang:select">
                <svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                简体中文
              </button>
              <button class="lang-option active" data-lang="en" data-action="lang:select">
                <svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                English
              </button>
              <button class="lang-option" data-lang="fr" data-action="lang:select">
                <svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Français
              </button>
              <button class="lang-option" data-lang="es" data-action="lang:select">
                <svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Español
              </button>
            </div>
          </div>
          <button class="btn btn-primary btn-sm" data-od-id="btn-new-post" data-action="post:new">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="btn_new_post">New Post</span>
          </button>
          <div class="notif-switch">
            <button class="notif-btn" data-action="notif:toggle" aria-label="Notifications" data-i18n-aria-label="aria_notifications">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
              <span class="notif-dot" hidden></span>
            </button>
            <div class="notif-dropdown">
              <div class="notif-dropdown-header">
                <strong data-i18n="notif_title">通知</strong>
                <button class="notif-mark-all" data-action="notif:mark-all-read" data-i18n="notif_mark_all_read">
                  全部标为已读
                </button>
              </div>
              <div class="notif-list"></div>
            </div>
          </div>
        </div>
      </div>
