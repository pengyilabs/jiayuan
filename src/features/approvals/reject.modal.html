<div class="modal-overlay" id="modal-reject" role="dialog" aria-modal="true" aria-labelledby="reject-modal-title">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3 id="reject-modal-title" data-i18n="modal_reject_reason">拒绝原因</h3>
      <button class="btn btn-ghost" data-action="modal:close" data-modal="modal-reject">&times;</button>
    </div>
    <div class="modal-body">
      <div id="reject-error" class="auth-alert" role="alert" hidden></div>
      <div class="form-group">
        <textarea id="reject-reason" rows="4" data-i18n-placeholder="form_reject_ph" placeholder="请输入拒绝原因..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="modal:close" data-modal="modal-reject" data-i18n="btn_cancel">取消</button>
      <button class="btn btn-danger" id="reject-confirm" data-action="approval:reject-confirm" data-i18n="btn_confirm_reject">确认拒绝</button>
    </div>
  </div>
</div>
