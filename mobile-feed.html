<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>加园地产 · 移动端</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface:#f7f8fa;--surface-warm:#fafafa;
  --fg:#111111;--muted:#6b7280;--meta:#9ca3af;--border:#e5e7eb;--border-soft:#f3f4f6;
  --accent:#ff385c;--accent-soft:#fff0f3;
  --success:#22c55e;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--radius-sm:8px;--radius-pill:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:var(--font);background:var(--surface);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* ── Status bar spacer ── */
.status-bar{height:env(safe-area-inset-top,0px);background:var(--bg);flex-shrink:0}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border-soft);flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px}
.topbar-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.topbar-title{font-size:17px;font-weight:700}
.topbar-actions{display:flex;gap:4px;align-items:center}
.topbar-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--fg)}
.topbar-icon:active{background:var(--surface)}
.topbar-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.topbar-lang{padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--fg);cursor:pointer;font-family:var(--font);transition:all 0.15s}
.topbar-lang:active{background:var(--surface)}

/* ── Feed ── */
.feed{flex:1;overflow-y:auto;padding:0 0 20px;-webkit-overflow-scrolling:touch}

/* Date group header */
.date-group{padding:16px 16px 8px;position:sticky;top:0;background:var(--surface);z-index:5}
.date-group-label{font-size:13px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:8px}
.date-group-count{font-size:11px;font-weight:500;color:var(--meta);background:var(--border-soft);padding:2px 8px;border-radius:var(--radius-pill)}

/* Post card */
.post-card{background:var(--bg);margin:0 12px 12px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}
.post-byline{flex:1;min-width:0}
.post-author{font-size:14px;font-weight:600;line-height:1.2}
.post-meta{font-size:11px;color:var(--meta);margin-top:1px}
.post-platform-tag{font-size:10px;font-weight:600;color:#fff;padding:3px 8px;border-radius:var(--radius-pill);flex-shrink:0}
.tag-fb{background:#1877F2}.tag-wx{background:#07C160}.tag-wxch{background:#FF6B2C}.tag-ig{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888)}.tag-xhs{background:#FE2C55}

/* Post image */
.post-img-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--surface)}
.post-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.post-img-wrap.ratio-45{aspect-ratio:4/5}
.post-img-wrap.ratio-169{aspect-ratio:16/9}
.post-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);color:#fff;padding:3px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;backdrop-filter:blur(4px);display:flex;align-items:center;gap:4px}
.post-video-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.post-video-play div{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.post-video-play svg{width:20px;height:20px;fill:#fff;margin-left:2px}

/* Carousel */
.carousel{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden}
.carousel-track{display:flex;height:100%;transition:transform 0.3s ease}
.carousel-track img{width:100%;min-width:100%;height:100%;object-fit:cover;flex-shrink:0}
.carousel-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);transition:all 0.2s}
.carousel-dot.active{background:#fff;width:16px;border-radius:3px}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
.carousel-btn:active{background:#fff}
.carousel-btn svg{width:14px;height:14px;stroke:#333;fill:none;stroke-width:2.5}
.carousel-prev{left:8px}.carousel-next{right:8px}

/* Post body */
.post-body{padding:10px 14px}
.post-title{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:4px}
.post-text{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-price{margin-top:6px;font-size:14px;font-weight:700;color:var(--accent)}
.post-hashtags{margin-top:4px;font-size:11px;color:var(--accent);line-height:1.3}
.post-status{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;margin-top:6px}
.status-published{background:#dcfce7;color:#166534}
.status-pending{background:#fef3c7;color:#92400e}
.status-draft{background:var(--border-soft);color:var(--muted)}
.status-rejected{background:#fee2e2;color:#991b1b}

/* Post actions */
.post-actions{display:flex;border-top:1px solid var(--border-soft);padding:0}
.post-action{flex:1;padding:10px 0;font-size:12px;color:var(--muted);text-align:center;cursor:pointer;font-weight:500;border:none;background:transparent;font-family:var(--font)}
.post-action:active{background:var(--surface)}
.post-action.liked{color:var(--accent)}

/* ── Bottom nav ── */
.bottom-nav{display:flex;align-items:flex-end;background:var(--bg);border-top:1px solid var(--border-soft);padding:6px 0 calc(6px + var(--safe-bottom));flex-shrink:0;position:relative;z-index:40}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;padding:4px 0;font-family:var(--font);color:var(--meta)}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn span{font-size:10px;font-weight:600}
.nav-btn-create{position:relative}
.nav-create-icon{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:-16px;box-shadow:0 2px 10px rgba(255,56,92,0.35);transition:transform 0.15s}
.nav-create-icon:active{transform:scale(0.9)}
.nav-create-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5}
.nav-btn-create span{margin-top:14px}

/* ── Bottom sheet ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:430px;height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp 0.25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 0}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border-soft);flex-shrink:0}
.sheet-title{font-size:17px;font-weight:700}
.sheet-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.sheet-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.sheet-body{padding:16px 20px 24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

/* Create flow steps */
.create-steps{display:flex;gap:4px;margin-bottom:20px}
.create-step{flex:1;height:3px;border-radius:2px;background:var(--border-soft);transition:background 0.2s}
.create-step.active{background:var(--accent)}
.create-step.done{background:var(--success)}

.step-label{font-size:13px;font-weight:600;color:var(--meta);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.03em}
.step-title{font-size:18px;font-weight:700;margin-bottom:16px}

/* Listing picker */
.listing-option{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all 0.15s;margin-bottom:8px}
.listing-option:active,.listing-option.selected{border-color:var(--accent);background:var(--accent-soft)}
.listing-thumb{width:52px;height:52px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0}
.listing-info{flex:1;min-width:0}
.listing-name{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listing-detail{font-size:12px;color:var(--muted);margin-top:2px}
.listing-price{font-size:13px;font-weight:700;color:var(--accent);margin-top:2px}

/* Platform picker */
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.platform-option{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all 0.15s}
.platform-option:active,.platform-option.selected{border-color:var(--accent);background:var(--accent-soft)}
.platform-option.selected::after{content:'✓';position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.platform-option{position:relative}
.platform-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.platform-name{font-size:13px;font-weight:600}

/* Template picker */
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl-card{border-radius:var(--radius);border:2px solid var(--border);cursor:pointer;transition:all 0.15s;overflow:hidden;background:var(--bg)}
.tpl-card:active,.tpl-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl-preview{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden}
/* Template A: Bold accent color block with listing photo inset */
.tpl-design-a{width:100%;height:100%;background:#ff385c;display:flex;flex-direction:column;padding:10px;position:relative}
.tpl-design-a .tpl-photo{width:100%;flex:1;border-radius:6px;object-fit:cover;margin-top:auto}
.tpl-design-a .tpl-brand{position:absolute;top:10px;left:10px;color:#fff;font-size:8px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:rgba(0,0,0,0.25);padding:3px 6px;border-radius:3px}
.tpl-design-a .tpl-price{position:absolute;top:10px;right:10px;color:#fff;font-size:12px;font-weight:800;text-align:right}
.tpl-design-a .tpl-title{position:absolute;top:50%;left:10px;right:10px;color:#fff;font-size:9px;font-weight:600;line-height:1.3;transform:translateY(-50%);text-shadow:0 1px 3px rgba(0,0,0,0.4)}
/* Template B: White card with colored accent strip + photo */
.tpl-design-b{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;position:relative}
.tpl-design-b .tpl-photo{width:100%;height:55%;object-fit:cover}
.tpl-design-b .tpl-info{flex:1;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.tpl-design-b .tpl-badge{font-size:7px;font-weight:700;color:#fff;background:#ff385c;padding:2px 6px;border-radius:3px;align-self:flex-start;margin-bottom:4px;text-transform:uppercase}
.tpl-design-b .tpl-price{font-size:13px;font-weight:800;color:#1a1a2e}
.tpl-design-b .tpl-address{font-size:8px;color:#666;margin-top:2px;line-height:1.2}
.tpl-design-b .tpl-brand{position:absolute;bottom:8px;right:8px;font-size:7px;font-weight:700;color:#ff385c;letter-spacing:0.03em}
/* Template C: Dark overlay style with gradient */
.tpl-design-c{width:100%;height:100%;position:relative;background:#1a1a2e}
.tpl-design-c .tpl-photo{width:100%;height:100%;object-fit:cover;opacity:0.6}
.tpl-design-c .tpl-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(26,26,46,0.85) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.tpl-design-c .tpl-brand{position:absolute;top:10px;left:10px;color:#fff;font-size:7px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.4);padding:2px 6px;border-radius:3px}
.tpl-design-c .tpl-price{color:#fff;font-size:13px;font-weight:800}
.tpl-design-c .tpl-title{color:rgba(255,255,255,0.9);font-size:9px;font-weight:500;margin-top:2px;line-height:1.3}
.tpl-design-c .tpl-tag{display:inline-block;margin-top:4px;background:rgba(255,255,255,0.15);color:#fff;font-size:7px;font-weight:600;padding:2px 6px;border-radius:3px;align-self:flex-start;backdrop-filter:blur(4px)}
/* Template D: Split bilingual with colored left panel */
.tpl-design-d{width:100%;height:100%;display:flex;position:relative}
.tpl-design-d .tpl-left{width:45%;background:#ff385c;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px;text-align:center}
.tpl-design-d .tpl-brand{color:rgba(255,255,255,0.7);font-size:6px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
.tpl-design-d .tpl-zh{color:#fff;font-size:11px;font-weight:700;line-height:1.3}
.tpl-design-d .tpl-en{color:rgba(255,255,255,0.8);font-size:8px;font-weight:500;margin-top:3px;line-height:1.2}
.tpl-design-d .tpl-photo{width:55%;height:100%;object-fit:cover}
.tpl-design-d .tpl-price{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:#fff;font-size:12px;font-weight:800;padding:6px 8px;text-align:center}
/* Blank template */
.tpl-blank{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:var(--surface);color:var(--meta)}
.tpl-blank svg{width:28px;height:28px;stroke:var(--border);margin-bottom:4px}
.tpl-blank span{font-size:10px;font-weight:600}
.tpl-label{padding:6px 8px;text-align:center}
.tpl-label-name{font-size:11px;font-weight:600;color:var(--fg);line-height:1.2}
.tpl-label-desc{font-size:9px;color:var(--meta);margin-top:1px;line-height:1.2}
/* Format selector */
.format-grid{display:flex;gap:8px;margin-top:12px}
.format-option{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:var(--radius);border:2px solid var(--border);cursor:pointer;transition:all 0.15s;text-align:center;background:var(--bg)}
.format-option:active,.format-option.selected{border-color:var(--accent);background:var(--accent-soft)}
.format-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);font-size:16px}
.format-option.selected .format-icon{background:var(--accent);color:#fff}
.format-name{font-size:11px;font-weight:600;color:var(--fg)}
.format-desc{font-size:9px;color:var(--meta);line-height:1.2}

/* ── Feed template-styled cards ──────────────────────── */
.feed-tpl{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);background:var(--bg)}
.feed-tpl .post-header{padding:10px 14px;display:flex;align-items:center;gap:10px}
.feed-tpl .post-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.feed-tpl .post-byline{flex:1;min-width:0}
.feed-tpl .post-author{font-size:13px;font-weight:600;color:var(--fg)}
.feed-tpl .post-meta{font-size:11px;color:var(--meta)}
.feed-tpl .post-actions{display:flex;border-top:1px solid var(--border-soft)}
.feed-tpl .post-action{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--fg);cursor:pointer;font-family:var(--font);transition:background 0.15s}
.feed-tpl .post-action:active{background:var(--surface)}
.feed-tpl .post-action.liked{color:var(--accent)}

/* Feed: Design A — red accent block */
.feed-tpl .feed-design-a{width:100%;aspect-ratio:4/5;background:#ff385c;display:flex;flex-direction:column;padding:14px;position:relative}
.feed-tpl .feed-design-a .feed-photo{width:100%;flex:1;border-radius:8px;object-fit:cover;margin-top:auto}
.feed-tpl .feed-design-a .feed-brand{position:absolute;top:14px;left:14px;color:#fff;font-size:10px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;background:rgba(0,0,0,0.25);padding:4px 8px;border-radius:4px}
.feed-tpl .feed-design-a .feed-price{position:absolute;top:14px;right:14px;color:#fff;font-size:15px;font-weight:800;text-align:right}
.feed-tpl .feed-design-a .feed-title{position:absolute;top:50%;left:14px;right:14px;color:#fff;font-size:13px;font-weight:600;line-height:1.4;transform:translateY(-50%);text-shadow:0 1px 4px rgba(0,0,0,0.4)}
.feed-tpl .feed-design-a .feed-body{padding:0 14px 10px}
.feed-tpl .feed-design-a .feed-hashtags{font-size:11px;color:var(--meta);margin-top:4px}

/* Feed: Design B — white card */
.feed-tpl .feed-design-b{width:100%;display:flex;flex-direction:column;position:relative;background:#fff}
.feed-tpl .feed-design-b .feed-photo{width:100%;height:240px;object-fit:cover}
.feed-tpl .feed-design-b .feed-info{padding:12px 14px}
.feed-tpl .feed-design-b .feed-badge{font-size:10px;font-weight:700;color:#fff;background:#ff385c;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;text-transform:uppercase}
.feed-tpl .feed-design-b .feed-price{font-size:16px;font-weight:800;color:#1a1a2e}
.feed-tpl .feed-design-b .feed-address{font-size:11px;color:#666;margin-top:2px;line-height:1.3}
.feed-tpl .feed-design-b .feed-brand{position:absolute;bottom:10px;right:14px;font-size:10px;font-weight:700;color:#ff385c;letter-spacing:0.03em}
.feed-tpl .feed-design-b .feed-body{padding:0 14px 10px}

/* Feed: Design C — dark overlay */
.feed-tpl .feed-design-c{width:100%;position:relative;background:#1a1a2e}
.feed-tpl .feed-design-c .feed-photo{width:100%;height:280px;object-fit:cover;opacity:0.6}
.feed-tpl .feed-design-c .feed-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(26,26,46,0.85) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.feed-tpl .feed-design-c .feed-brand{position:absolute;top:14px;left:14px;color:#fff;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.4);padding:3px 8px;border-radius:4px}
.feed-tpl .feed-design-c .feed-price{color:#fff;font-size:16px;font-weight:800}
.feed-tpl .feed-design-c .feed-title{color:rgba(255,255,255,0.9);font-size:12px;font-weight:500;margin-top:2px;line-height:1.4}
.feed-tpl .feed-design-c .feed-tag{display:inline-block;margin-top:6px;background:rgba(255,255,255,0.15);color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;align-self:flex-start;backdrop-filter:blur(4px)}
.feed-tpl .feed-design-c .feed-body{padding:0 14px 10px}

/* Feed: Design D — split bilingual */
.feed-tpl .feed-design-d{width:100%;display:flex;position:relative}
.feed-tpl .feed-design-d .feed-left{width:45%;background:#ff385c;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;text-align:center}
.feed-tpl .feed-design-d .feed-brand{color:rgba(255,255,255,0.7);font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.feed-tpl .feed-design-d .feed-zh{color:#fff;font-size:14px;font-weight:700;line-height:1.4}
.feed-tpl .feed-design-d .feed-en{color:rgba(255,255,255,0.8);font-size:11px;font-weight:500;margin-top:4px;line-height:1.3}
.feed-tpl .feed-design-d .feed-photo{width:55%;height:220px;object-fit:cover}

.feed-tpl .feed-design-d .feed-body{padding:0 14px 10px}

/* Sheet footer */
.sheet-footer{display:flex;gap:8px;padding:12px 20px calc(12px + var(--safe-bottom));border-top:1px solid var(--border-soft);flex-shrink:0;background:var(--bg)}
.btn{flex:1;padding:12px;border-radius:var(--radius);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:var(--surface);color:var(--fg)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}

/* Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%) translateY(-20px);background:var(--fg);color:#fff;padding:10px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:200;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--meta)}
.empty-state svg{width:48px;height:48px;stroke:var(--border);margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.5}

/* Hide scrollbar */
.feed::-webkit-scrollbar,.sheet::-webkit-scrollbar,.sheet-body::-webkit-scrollbar{display:none}
.feed,.sheet,.sheet-body{scrollbar-width:none}
</style>

  feed.innerHTML = dates.map(d => {

    const wd = WEEKDAYS[dt.getDay()];

// ── Carousel interaction ────────────────────────────────
function initCarousels() {
  document.querySelectorAll("[data-carousel]").forEach(el => {
    const track = el.querySelector(".carousel-track");
    const dots = el.querySelectorAll(".carousel-dot");
    const prev = el.querySelector(".carousel-prev");
    const next = el.querySelector(".carousel-next");
    if (!track) return;
    let idx = 0;
    const total = el.querySelectorAll("img").length;
    const update = i => { idx = (i + total) % total; track.style.transform = `translateX(-${idx*100}%)`; dots.forEach((d,j) => d.classList.toggle("active", j===idx)); };
    if (prev) prev.onclick = e => { e.stopPropagation(); update(idx-1); };
    if (next) next.onclick = e => { e.stopPropagation(); update(idx+1); };
    dots.forEach((d,j) => { d.onclick = e => { e.stopPropagation(); update(j); }; });
    let startX = 0;
    track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener("touchend", e => { const diff = startX - e.changedTouches[0].clientX; if (Math.abs(diff) > 40) update(idx + (diff > 0 ? 1 : -1)); }, {passive:true});
  });
}

function selectListing(id) { createState.listingId = id; renderCreateStep(); }
function selectPlatform(id) {
  const idx = createState.platforms.indexOf(id);
  if (idx === -1) createState.platforms.push(id);
  else createState.platforms.splice(idx, 1);
  renderCreateStep();
}
function selectTemplate(id) { createState.templateId = id; renderCreateStep(); }
function selectFormat(fmt) { createState.templateFormat = fmt; renderCreateStep(); }

function nextStep() { createStep++; renderCreateStep(); }
function prevStep() { createStep--; renderCreateStep(); }

function confirmPost() {
  const listing = LISTINGS.find(l => l.id === createState.listingId);
  const title = listing ? `${listing.title} · 好房推荐` : "加园地产 · 新内容";
  const today = new Date().toISOString().slice(0,10);
  const hasTemplate = createState.templateId && createState.templateId !== null;
  const fmt = createState.templateFormat || "single";

  // Find carousel images from existing posts for this listing
  let carouselImages = [];
  if (listing) {
    const existingCarousel = POSTS.find(p => p.listingId === listing.id && p.media === "carousel" && p.images && p.images.length > 1);
    if (existingCarousel) carouselImages = existingCarousel.images;
  }

  // Determine media type and images based on format choice
  let mediaType = "single";
  let images = [listing ? listing.photo : "images/listings/condo3.jpg"];

  if (hasTemplate) {
    if (fmt === "carousel" && carouselImages.length > 1) {
      mediaType = "carousel";
      images = carouselImages;
    } else if (fmt === "video") {
      mediaType = "video";
    }
    // else fmt === "single" → keep default single image
  }

  createState.platforms.forEach(platform => {
    const newPost = {
      id: nextPostId++,
      listingId: createState.listingId,
      title,
      platform,
      status: "pending",
      date: today,
      media: mediaType,
      images: images,
      description: listing ? `${listing.title}，${listing.beds}卧${listing.baths}卫，${listing.price}` : "新内容即将发布",
      price: listing ? listing.price : "—",
      beds: listing ? listing.beds : 0,
      baths: listing ? listing.baths : 0,
      hashtags: "",
      templateId: hasTemplate ? createState.templateId : null
    };
    POSTS.unshift(newPost);
  });

  closeCreate();
  renderFeed();
  const count = createState.platforms.length;
  toast(`${count} ${t('posted')}`);
  document.getElementById("feed").scrollTo({ top: 0, behavior: "smooth" });
}
